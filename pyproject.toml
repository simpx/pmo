[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "pmo"
version = "0.5.2"
description = "simple process manager"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "simpxx", email = "simpxx@gmail.com"}
]
keywords = ["command-line", "tool", "process-manager"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# Python dependencies are no longer needed since Rust handles everything
dependencies = []

[project.scripts]
pmo = "pmo:main"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "pmo._pmo_rs"
python-source = "python"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "twine>=6.1.0",
    "maturin>=1.5,<2.0",
]
