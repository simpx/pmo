[package]
name = "pmo"
version = "0.5.2"
edition = "2021"
description = "A simple process manager"
license = "MIT"
authors = ["simpxx <simpxx@gmail.com>"]

[lib]
name = "pmo"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "pmo"
path = "src/main.rs"

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
regex = "1.10"
nix = { version = "0.29", features = ["signal", "process"] }
libc = "0.2"
chrono = "0.4"
hostname = "0.4"
dotenv = "0.15"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
comfy-table = "7.1"
ctrlc = "3.4"
notify = "6.1"
thiserror = "1.0"
anyhow = "1.0"
glob = "0.3"

[build-dependencies]
pyo3-build-config = "0.22"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
